name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
      after-version:
        description: "Snapshot version after release"
        required: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate publishing configuration
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [[ -z "${CURSEFORGE_TOKEN}" ]]; then
            echo "::error::The CURSEFORGE_TOKEN repository secret is not configured."
            exit 1
          fi
          if [[ -z "${MODRINTH_TOKEN}" ]]; then
            echo "::error::The MODRINTH_TOKEN repository secret is not configured."
            exit 1
          fi

  set-release-version:
    needs: validate-release
    uses: ./.github/workflows/set-version.yml
    with:
      version: ${{ inputs.version }}

  build:
    needs: set-release-version
    runs-on: ubuntu-latest
    outputs:
      release_targets: ${{ steps.release_targets.outputs.targets }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Build with Gradle
        run: ./gradlew chiseledBuild

      - name: Build Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: COMMIT
          toTag: ${{ github.ref }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "commit_template": "- [`#{{SHORT_MERGE_SHA}}`](https://github.com/#{{OWNER}}/#{{REPO}}/commit/#{{MERGE_SHA}}) #{{TITLE}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Performance", "labels": ["perf"] },
                { "title": "## Refactor", "labels": ["refactor"] },
                { "title": "## Documentation", "labels": ["docs"] },
                { "title": "## Build", "labels": ["build", "chore", "ci"] },
                { "title": "## Other", "labels": [] }
              ],
              "empty_template": "no changes",
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "custom_placeholders": [
                {
                  "name": "SHORT_MERGE_SHA",
                  "source": "MERGE_SHA",
                  "transformer": {
                    "pattern": "^([0-9a-f]{7})[0-9a-f]*$",
                    "target": "$1"
                  }
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare platform release artifacts
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: printf '%s\n' "${CHANGELOG}" > release-changelog.md

      - name: Build platform release matrix
        id: release_targets
        run: |
          mapfile -t VERSION_FILES < <(find versions -mindepth 2 -maxdepth 2 -name gradle.properties | sort -V)
          TARGETS=$(for file in "${VERSION_FILES[@]}"; do
            MINECRAFT_VERSION=$(grep "^minecraft_version=" "${file}" | cut -d= -f2)
            JAVA_VERSION=$(grep "^java_version=" "${file}" | cut -d= -f2)
            jq -n -c \
              --arg minecraft "${MINECRAFT_VERSION}" \
              --arg java "${JAVA_VERSION}" \
              '{minecraft: $minecraft, java: ($java | tonumber)}'
          done | jq -s -c '.')
          echo "targets=${TARGETS}" >> "${GITHUB_OUTPUT}"

      - name: Upload platform release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: platform-release-${{ inputs.version }}
          path: |
            release-changelog.md
            versions/*/build/libs/anarchymod-mc-*-${{ inputs.version }}.jar
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          link() { echo "[${1}](${DOWNLOAD_URL}/anarchymod-mc-${1}-${VERSION}.jar)"; }
          join() { local IFS=","; local out="$*"; echo "${out//,/, }"; }

          mapfile -t MC_VERSIONS < <(for f in versions/*/gradle.properties; do
            grep "^minecraft_version=" "$f" | cut -d= -f2
          done | sort -V)

          rows=()
          group_key=""
          group_links=()

          flush_group() {
            [ ${#group_links[@]} -eq 0 ] && return
            rows+=("| ${group_key} | $(join "${group_links[@]}") |")
          }

          for v in "${MC_VERSIONS[@]}"; do
            key=$(echo "$v" | cut -d. -f1,2)
            if [ "$key" != "$group_key" ]; then
              flush_group
              group_key="$key"
              group_links=()
            fi
            group_links+=("$(link "$v")")
          done
          flush_group

          TABLE_ROWS=$(printf "%s\n" "${rows[@]}")

          NOTES=$(cat <<EOF
          ## Downloads

          Grab the jar matching your Minecraft version. All builds are also attached below under Assets.

          | Minecraft versions | Downloads |
          |---|---|
          ${TABLE_ROWS}

          ${CHANGELOG}
          EOF
          )

          shopt -s nullglob
          ASSETS=(versions/*/build/libs/anarchymod-mc-*-"${VERSION}".jar)
          shopt -u nullglob

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No built jars matched versions/*/build/libs/anarchymod-mc-*-${VERSION}.jar - refusing to create an empty release." >&2
            exit 1
          fi

          gh release create "${VERSION}" \
            --title "AnarchyMod ${VERSION}" \
            --notes "${NOTES}" \
            "${ASSETS[@]}"

      - name: Update README download links
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          link() { echo "[${1}](${DOWNLOAD_URL}/anarchymod-mc-${1}-${VERSION}.jar)"; }
          join() { local IFS=","; local out="$*"; echo "${out//,/, }"; }

          mapfile -t MC_VERSIONS < <(for f in versions/*/gradle.properties; do
            grep "^minecraft_version=" "$f" | cut -d= -f2
          done | sort -V)

          rows=()
          group_key=""
          group_links=()
          group_javas=()

          flush_group() {
            [ ${#group_links[@]} -eq 0 ] && return
            mapfile -t uniq_java < <(printf "%s\n" "${group_javas[@]}" | sort -un)
            java_label=$(IFS="/"; echo "${uniq_java[*]}")
            rows+=("| $(join "${group_links[@]}") | ${java_label} |")
          }

          for v in "${MC_VERSIONS[@]}"; do
            key=$(echo "$v" | cut -d. -f1,2)
            jv=$(grep "^java_version=" "versions/$v/gradle.properties" | cut -d= -f2)
            if [ "$key" != "$group_key" ]; then
              flush_group
              group_key="$key"
              group_links=()
              group_javas=()
            fi
            group_links+=("$(link "$v")")
            group_javas+=("$jv")
          done
          flush_group

          {
            echo "| Minecraft versions | Required Java |"
            echo "|-----------|--------------|"
            printf "%s\n" "${rows[@]}"
          } > /tmp/versions-table.md

          awk -v tablefile=/tmp/versions-table.md '
            BEGIN { while ((getline line < tablefile) > 0) table = table line "\n" }
            /<!-- versions-table:start -->/ { print; print ""; printf "%s", table; skip=1; next }
            /<!-- versions-table:end -->/ { skip=0; print ""; print; next }
            !skip { print }
          ' README.md > README.md.new
          mv README.md.new README.md

      - name: Commit README
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(release): update README download links for ${{ inputs.version }}"
          file_pattern: README.md

  publish-platforms:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.build.outputs.release_targets) }}
    steps:
      - name: Download platform release artifacts
        uses: actions/download-artifact@v8
        with:
          name: platform-release-${{ inputs.version }}

      - name: Publish Minecraft ${{ matrix.target.minecraft }}
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: 1644776
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: anarchymod
          modrinth-featured: true
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: subset
          files: versions/${{ matrix.target.minecraft }}/build/libs/anarchymod-mc-${{ matrix.target.minecraft }}-${{ inputs.version }}.jar
          name: AnarchyMod ${{ inputs.version }} for Minecraft ${{ matrix.target.minecraft }}
          version: ${{ inputs.version }}
          modrinth-version: ${{ inputs.version }}+mc${{ matrix.target.minecraft }}
          version-type: release
          changelog-file: release-changelog.md
          loaders: fabric
          environment: client
          game-versions: ${{ matrix.target.minecraft }}
          game-version-filter: none
          modrinth-java: ${{ matrix.target.java }}

  set-after-version:
    needs: publish-platforms
    uses: ./.github/workflows/set-version.yml
    with:
      version: ${{ inputs.after-version }}
